name: Check opportunities and hub, then publish Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: entomology-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      stale: ${{ steps.persist.outputs.stale }}
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate editorial data and date handling
        run: |
          python scripts/validate.py --normalise
          python -m unittest discover -s tests -v
          node tests/test_board.cjs
          node tests/test_admin.cjs
          node --test admin-backend/test-worker.mjs admin-backend/test-research.mjs admin-backend/test-research-integration.mjs
      - name: Discover candidates and check existing links
        run: python scripts/refresh.py
      - name: Refresh entomology news and research highlights
        run: python scripts/refresh_hub.py
      - name: Create review digest
        run: |
          python scripts/review.py digest --output review-digest.md
          cat review-digest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve review evidence for this run
        uses: actions/upload-artifact@v7
        with:
          name: opportunity-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            review-digest.md
            data/review-queue.json
            site/data/health.json
          if-no-files-found: error
          retention-days: 30
      # A newer human push normally queues a fresh run. Keep this run's evidence
      # above, then skip its publication if main moved; never overwrite that push.
      - name: Preserve check results and review queue
        id: persist
        run: python scripts/persist_checks.py
      - uses: actions/configure-pages@v5
        if: steps.persist.outputs.stale == 'false'
      - uses: actions/upload-pages-artifact@v4
        if: steps.persist.outputs.stale == 'false'
        with:
          path: site
  deploy:
    runs-on: ubuntu-24.04
    needs: build
    if: needs.build.outputs.stale == 'false'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
